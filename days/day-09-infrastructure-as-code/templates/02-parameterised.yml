AWSTemplateFormatVersion: '2010-09-09'
Description: Shop storage with environment parameter and bucket output
Parameters:
  EnvironmentName:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - staging
      - prod
Resources:
  ShopBucket:
    Type: AWS::S3::Bucket
    Properties:
      VersioningConfiguration:
        Status: Enabled
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName
Outputs:
  BucketName:
    Description: Name of the shop bucket
    Value: !Ref ShopBucket
